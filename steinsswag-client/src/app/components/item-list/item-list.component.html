<div class="item-page">
  <h2>Items</h2>

  @if (loading()) {
  <div>Loading...</div>
  }
  @if (error()) {
  <div class="error-message">{{ error() }}</div>
  }

  <table class="item-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Status</th>
        <th>Source</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.id) {
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.categoryName }}</td>
        <td>&euro;{{ item.price }}</td>
        <td>{{ item.status }}</td>
        <td>{{ item.sourcePlatform }}</td>
        <td><button (click)="deleteItem(item.id, item.name)">Delete</button></td>
      </tr>
      }
    </tbody>
  </table>

  <h3>Add item</h3>
  <form (ngSubmit)="addItem()">
    <input [(ngModel)]="newItem.name" name="name" placeholder="Name" required />
    <input [(ngModel)]="newItem.price" name="price" type="number" placeholder="Price" required />

    <select [(ngModel)]="newItem.categoryId" name="categoryId" required>
      <option [ngValue]="0" disabled>Select category</option>
      @for (c of categories(); track c.id) {
      <option [ngValue]="c.id">{{ c.name }}</option>
      }
    </select>

    <select [(ngModel)]="newItem.sourcePlatform" name="sourcePlatform">
      @for (p of sourcePlatforms; track p) {
      <option [ngValue]="p">{{ p }}</option>
      }
    </select>

    <select [(ngModel)]="newItem.condition" name="condition">
      @for (c of conditions; track c) {
      <option [ngValue]="c">{{ c }}</option>
      }
    </select>

    <button type="submit" [disabled]="loading()">Add item</button>
  </form>
</div>
