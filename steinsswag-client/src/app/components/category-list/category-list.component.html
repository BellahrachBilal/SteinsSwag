<div class="category-page">
  <h2>Categories</h2>

  @if (loading()) {
  <div>Loading...</div>
  }
  @if (error()) {
  <div class="error-message">{{ error() }}</div>
  }

  <table class="category-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Items</th>
      </tr>
    </thead>
    <tbody>
      @for (category of categories(); track category.id) {
      <tr>
        <td>{{ category.name }}</td>
        <td>{{ category.itemCount }}</td>
      </tr>
      }
    </tbody>
  </table>

  <h3>Add category</h3>
  <form (ngSubmit)="addCategory()">
    <input [(ngModel)]="newCategory.name" name="name" placeholder="Category name" required />
    <button type="submit" [disabled]="loading()">Add category</button>
  </form>
</div>
